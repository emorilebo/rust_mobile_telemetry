[package]
name = "rust_mobile_telemetry"
version = "0.2.0"
edition = "2021"
authors = ["Godfrey Lebo <emorylebo@gmail.com>"]
description = "One-call OpenTelemetry setup for Rust mobile backends and edge services: tracing spans + metrics, OTLP or stdout export, app/device metadata, flush on shutdown."
license = "MIT"
repository = "https://github.com/emorilebo/rust_mobile_telemetry"
homepage = "https://github.com/emorilebo/rust_mobile_telemetry"
documentation = "https://docs.rs/rust_mobile_telemetry"
readme = "README.md"
keywords = ["opentelemetry", "observability", "tracing", "metrics", "otlp"]
categories = ["development-tools::profiling", "development-tools::debugging"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
opentelemetry = { version = "0.21", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.14", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry-stdout = { version = "0.2", features = ["trace", "metrics"] }
tracing = "0.1"
tracing-opentelemetry = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "std"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.4", features = ["gen-tonic", "trace", "metrics"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.9"

[features]
default = []
# Deprecated no-op, kept so `features = ["instrumentation"]` keeps compiling.
# It used to pull in `reqwest`, which no code in this crate ever used.
instrumentation = []
